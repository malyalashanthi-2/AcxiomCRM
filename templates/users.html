{% extends "base.html" %}{% block content %}<h1 class="h2 mb-3">User & Role Management</h1><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Change role</th></tr></thead><tbody>
{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{'Active' if u.active else 'Inactive'}}</td><td><form method="post" action="{{url_for('change_role',user_id=u.id)}}" class="d-flex gap-2"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select class="form-select form-select-sm" name="role">{% for role in ['Admin','Manager','SalesExecutive'] %}<option {% if u.role==role %}selected{% endif %}>{{role}}</option>{% endfor %}</select><button class="btn btn-sm btn-primary">Save</button></form></td></tr>{% endfor %}
</tbody></table></div></div>{% endblock %}
